<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <div class="nav-inicio">
        <header>
            <nav>
                <ul>
                    <a href="#Inicio">Inicio</a>
                    <a href="#Contacto">Contacto</a>
                    <a href="#SobreNosotros">Sobre Nosotros</a>
                </ul>
            </nav>
        </header>
    </div>
    <div class="cuerpo">
        <h1>¿Necesitas ayuda?</h1>

        <h2>Contáctanos</h2>

        <form id="formulario-contacto">
            <p><label>Correo electrónico: </label><input type="email" name="correo" id="correo" required></p>
            
            <p><label>Titulo del problema: </label><input type="text" name="titulo-problema" id="titulo-problema" required></p>

            <p><label>Describe tu problema</label></p>
            
            <p><textarea name="descripcion" id="descripcion" required></textarea></p>

            <button type="submit" name="enviar" id="enviar">Enviar</button>
        </form>
    </div>
    
</body>
</html>
